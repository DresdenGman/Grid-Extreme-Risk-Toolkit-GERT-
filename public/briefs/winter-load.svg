<text x="136" y="858" text-anchor="start" font-size="24">Feb 14 · 00h</text><text x="584.9014084507041" y="858" text-anchor="middle" font-size="24">Feb 15 · 00h</text><text x="1033.8028169014083" y="858" text-anchor="middle" font-size="24">Feb 16 · 00h</text><text x="1464" y="858" text-anchor="end" font-size="24">Feb 16 · 23h</text>
