name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-training.txt
          pip install pytest
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Lint (compile)
        run: python -m compileall api models services risk features db training
      - name: Tests
        run: python -m pytest -vv --tb=line

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test:frontend
      - name: Typecheck
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_DATA_MODE: demo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --no-cache -t gert-backend:ci .
      - name: Inspect image
        run: |
          docker image inspect gert-backend:ci \
            --format 'user={{.Config.User}} size={{.Size}}'
      - name: Start container
        run: |
          docker run -d \
            --name gert-backend-ci \
            -p 8001:8000 \
            -e APP_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=8000 \
            -e ALLOWED_ORIGINS=https://grid-extreme-risk-toolkit-gert.vercel.app,https://gert-d.vercel.app \
            -e MODEL_BACKEND=stub \
            -e DATABASE_URL=sqlite:////data/gert.db \
            gert-backend:ci
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/ready && break
            sleep 1
          done
      - name: Verify endpoints
        run: |
          curl --fail --silent --show-error --max-time 10 http://localhost:8001/health
          curl --fail --silent --show-error --max-time 10 http://localhost:8001/ready
          curl --fail --silent --show-error --max-time 10 http://localhost:8001/status
          curl --fail --silent --show-error --max-time 10 http://localhost:8001/model/evidence
          prediction_status=$(curl --silent --output /tmp/predict-response.json --write-out '%{http_code}' --max-time 10 \
            -X POST http://localhost:8001/predict \
            -H 'Content-Type: application/json' \
            -d '{"region":"ERCOT_SYSTEM","date":"2026-01-01T01:00:00Z","weather_features":{"temperature":30,"wind_speed":5,"solar_irradiance":600}}')
          test "$prediction_status" = "503"
      - name: Verify security headers
        run: |
          headers=$(curl --silent --dump-header - --output /dev/null --max-time 10 http://localhost:8001/health | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          grep -q '^x-content-type-options: nosniff$' <<< "$headers"
          grep -q '^x-frame-options: deny$' <<< "$headers"
          grep -q '^referrer-policy: no-referrer$' <<< "$headers"
          grep -q '^strict-transport-security:' <<< "$headers"
      - name: Verify CORS
        run: |
          echo "=== Trusted origin ==="
          curl -i --max-time 10 \
            -X OPTIONS http://localhost:8001/predict \
            -H 'Origin: https://grid-extreme-risk-toolkit-gert.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' 2>&1 | grep -i access-control-allow-origin
          echo "=== Untrusted origin (no allow-origin header expected) ==="
          curl -i --max-time 10 \
            -X OPTIONS http://localhost:8001/predict \
            -H 'Origin: https://untrusted.example' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' 2>&1 | grep -i access-control-allow-origin || echo "No CORS header returned (correct)"
      - name: Show container logs
        if: always()
        run: docker logs gert-backend-ci || true
      - name: Clean up container
        if: always()
        run: docker rm -f gert-backend-ci || true
