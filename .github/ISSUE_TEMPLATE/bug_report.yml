name: Product or API bug
description: Report a reproducible defect in the public product
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and the page or endpoint involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: source_state
    attributes:
      label: Source state shown by GERT
      description: For example LIVE API, SIMULATED DEMO, GATED, or unavailable.
  - type: textarea
    id: environment
    attributes:
      label: Browser and environment
      description: Browser version, operating system, and any relevant console error.
    validations:
      required: false
